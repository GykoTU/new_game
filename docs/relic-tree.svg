<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1040" height="720" fill="#fdfcfa"/>
  <text class="t h1" x="40" y="46">Relic tree: meta progression between runs</text>
  <text class="t sm mu" x="40" y="70">Stage 8. See ARCHITECTURE.md, "Relic tree".</text>

  <text class="t h2" x="40" y="112">A &#183; Where relics come from, and where they go</text>
  <rect class="box" x="40" y="128" width="280" height="110" rx="8"/>
  <text class="t lb" x="56" y="152">found in a run</text>
  <text class="t sm mu" x="56" y="174">relic caches: 1&#8211;3 (+ Relic Sense)</text>
  <text class="t sm mu" x="56" y="194">banked when the run is saved (dawn,</text>
  <text class="t sm mu" x="56" y="214">quitting) or when the base falls</text>
  <rect class="box" x="40" y="252" width="280" height="92" rx="8"/>
  <text class="t lb" x="56" y="276">paid when the base falls</text>
  <text class="t sm mu" x="56" y="298">1 per night survived (day &#8722; 1)</text>
  <text class="t sm mu" x="56" y="318">+ 1 per 3 levels reached</text>
  <rect class="stat" x="380" y="128" width="280" height="216" rx="8"/>
  <text class="t lb" x="396" y="152">the profile (profile.save)</text>
  <text class="t sm mu" x="396" y="176">relics: what is left to spend</text>
  <text class="t sm mu" x="396" y="196">meta: {node id: level}</text>
  <text class="t sm mu" x="396" y="228">the title screen's Relic Tree buys a</text>
  <text class="t sm mu" x="396" y="248">level (relics &#8722; cost) or refunds</text>
  <text class="t sm mu" x="396" y="268">everything (all relics back), and</text>
  <text class="t sm mu" x="396" y="288">writes the profile at once</text>
  <path class="ar" d="M320,183 L376,200"/>
  <path class="ar" d="M320,298 L376,270"/>
  <rect class="dec" x="720" y="128" width="280" height="216" rx="8"/>
  <text class="t lb" x="736" y="152">who can be bought</text>
  <text class="t sm mu" x="736" y="176">the Hearth is always owned</text>
  <text class="t sm mu" x="736" y="196">a node: one owned neighbour</text>
  <text class="t sm mu" x="736" y="216">a synergy node (needs_all): both</text>
  <text class="t sm mu" x="736" y="236">neighbours, one from each branch</text>
  <text class="t sm mu" x="736" y="268">price per level: costs[level]</text>
  <text class="t sm mu" x="736" y="288">only a full refund, so nothing is</text>
  <text class="t sm mu" x="736" y="308">left hanging from a sold node</text>
  <path class="ar" d="M660,236 L716,236"/>

  <text class="t h2" x="40" y="392">B &#183; A run keeps the tree it started with</text>
  <rect class="step" x="40" y="408" width="300" height="130" rx="8"/>
  <text class="t lb" x="56" y="432">new run</text>
  <text class="t sm mu" x="56" y="454">MetaState from profile["meta"]</text>
  <text class="t sm mu" x="56" y="474">(the run's snapshot, main.meta)</text>
  <text class="t sm mu" x="56" y="494">gold, blueprints, "meta:" modifiers;</text>
  <text class="t sm mu" x="56" y="514">extra workers when the base is placed</text>
  <rect class="step" x="370" y="408" width="300" height="130" rx="8"/>
  <text class="t lb" x="386" y="432">run save, key "meta"</text>
  <text class="t sm mu" x="386" y="454">{levels, locks}: loads FIRST, so</text>
  <text class="t sm mu" x="386" y="474">perks shape progression's load and</text>
  <text class="t sm mu" x="386" y="494">"meta:" sources rebuild from it; a</text>
  <text class="t sm mu" x="386" y="514">refund at the title changes nothing</text>
  <rect class="good" x="700" y="408" width="300" height="130" rx="8"/>
  <text class="t lb" x="716" y="432">_apply_meta_rules</text>
  <text class="t sm mu" x="866" y="432">(new run, load)</text>
  <text class="t sm mu" x="716" y="454">Unlocks.set_locked: blueprints</text>
  <text class="t sm mu" x="716" y="474">Progression.locked: augments</text>
  <text class="t sm mu" x="716" y="494">rerolls_per_pick, choices,</text>
  <text class="t sm mu" x="716" y="514">PointsOfInterest.relic_bonus</text>
  <path class="ar" d="M340,473 L366,473"/>
  <path class="ar" d="M670,473 L696,473"/>

  <text class="t h2" x="40" y="584">C &#183; Effects a node can carry (any mix; per level unless noted)</text>
  <rect class="box" x="40" y="600" width="960" height="84" rx="8"/>
  <text class="t sm mu" x="56" y="626">modifiers (scaled like upgrade levels) &#183; start_resources &#183; start_workers &#183; start_blueprints (owned)</text>
  <text class="t sm mu" x="56" y="648">unlocks_content: "blueprint:&#8230;" / "augment:&#8230;" stay out of runs until owned &#183; perks: rerolls, choices, relic_bonus</text>
  <text class="t sm mu" x="56" y="670">Branches (colour only): Arms (weapons), Hands (workers), Walls (defence), Paths (exploration)</text>
</svg>
