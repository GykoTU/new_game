<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" width="1040" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .note { fill:#faf9f6; stroke:#ddd7cd; stroke-width:1.2; stroke-dasharray:4 3; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .grass { fill:#8fb36a; stroke:#fdfcfa; stroke-width:1; }
      .lava  { fill:#b8452e; stroke:#fdfcfa; stroke-width:1; }
      .cob   { fill:#9a958c; stroke:#fdfcfa; stroke-width:1; }
      .mark  { fill:#5ccbef; fill-opacity:0.45; stroke:#9be7ff; stroke-width:2; }
      .mine  { fill:#e6c34a; stroke:#7a5f10; stroke-width:1.5; }
      .num   { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:700; fill:#1d2a33; }
    </style>
  </defs>
  <rect width="1040" height="900" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Lava, cobble and the bucket</text>
  <text class="t sm mu" x="40" y="70">Stage 2c. See ARCHITECTURE.md, "Lava, cobble and the bucket".</text>

  <!-- ===== A: bucket ===== -->
  <text class="t h2" x="40" y="112">A &#183; The bucket, from the Craft tab to cooling lava</text>

  <rect class="stat" x="40" y="130" width="210" height="96" rx="8"/>
  <text class="t lb" x="56" y="154">Craft: Bucket (5 wood)</text>
  <text class="t sm mu" x="56" y="174">shop kind ITEM, one-off;</text>
  <text class="t sm mu" x="56" y="192">leaves the shop once owned</text>
  <text class="m sm" x="56" y="214">+ "item:bucket"</text>

  <rect class="step" x="280" y="130" width="210" height="96" rx="8"/>
  <text class="t lb" x="296" y="154">Empty bucket: send it</text>
  <text class="t sm mu" x="296" y="174">click it in the item bar,</text>
  <text class="t sm mu" x="296" y="192">then click a water tile</text>
  <text class="t sm mu" x="296" y="210">(ghost, like placing)</text>

  <rect class="good" x="520" y="130" width="210" height="96" rx="8"/>
  <text class="t lb" x="536" y="154">One builder fills it</text>
  <text class="t sm mu" x="536" y="174">walks to the chosen tile,</text>
  <text class="t sm mu" x="536" y="192">fill_work = 2 builder-seconds;</text>
  <text class="t sm mu" x="536" y="210">never two builders at once</text>

  <rect class="good" x="760" y="130" width="240" height="96" rx="8"/>
  <text class="t lb" x="776" y="154">Water bucket, for good</text>
  <text class="m sm" x="776" y="176">+ "item:water_bucket"</text>
  <text class="t sm mu" x="776" y="196">item bar: bucket_full.png;</text>
  <text class="t sm mu" x="776" y="214">take it in hand to mark lava</text>

  <path class="ar" d="M250,178 L278,178"/>
  <path class="ar" d="M490,178 L518,178"/>
  <path class="ar" d="M730,178 L758,178"/>

  <!-- ===== B: painting and cobbling ===== -->
  <text class="t h2" x="40" y="282">B &#183; Paint the lava, builders work inward from the edge</text>

  <!-- 8 x 5 grid, 40 px tiles, at (60, 300) -->
  <g>
    <!-- column 0: grass -->
    <rect class="grass" x="60" y="300" width="40" height="40"/>
    <rect class="grass" x="60" y="340" width="40" height="40"/>
    <rect class="grass" x="60" y="380" width="40" height="40"/>
    <rect class="grass" x="60" y="420" width="40" height="40"/>
    <rect class="grass" x="60" y="460" width="40" height="40"/>
    <!-- columns 1..7: lava -->
    <rect class="lava" x="100" y="300" width="280" height="200"/>
    <!-- grid lines over the lava -->
    <path d="M140,300 V500 M180,300 V500 M220,300 V500 M260,300 V500 M300,300 V500 M340,300 V500 M100,340 H380 M100,380 H380 M100,420 H380 M100,460 H380" stroke="#fdfcfa" stroke-width="1"/>
    <!-- cobbled tiles on the marked row -->
    <rect class="cob" x="100" y="380" width="40" height="40"/>
    <rect class="cob" x="140" y="380" width="40" height="40"/>
    <!-- still marked -->
    <rect class="mark" x="182" y="382" width="36" height="36"/>
    <rect class="mark" x="222" y="382" width="36" height="36"/>
    <rect class="mark" x="262" y="382" width="36" height="36"/>
    <!-- island -->
    <rect class="mark" x="302" y="462" width="36" height="36"/>
    <!-- gold mine -->
    <rect class="mine" x="306" y="386" width="28" height="28" rx="4"/>
    <text class="num" x="114" y="405">1</text>
    <text class="num" x="154" y="405">2</text>
    <text class="num" x="194" y="405">3</text>
    <text class="num" x="234" y="405">4</text>
    <text class="num" x="274" y="405">5</text>
    <text class="num" x="316" y="487">?</text>
  </g>
  <text class="t sm mu" x="60" y="520">grass &#183; lava &#183; cobble (grey) &#183; marked (blue) &#183; gold mine (yellow)</text>

  <rect class="box" x="420" y="300" width="580" height="210" rx="8"/>
  <text class="t lb" x="436" y="324">What happens</text>
  <text class="t bd" x="436" y="348">&#8226; Take the water bucket from the item bar, then drag over lava:</text>
  <text class="t bd" x="436" y="368">  every tile on the line is marked (start on a marked one to unmark).</text>
  <text class="t bd" x="436" y="392">&#8226; A builder stands on a walkable tile next to the lava, so</text>
  <text class="t bd" x="436" y="412">  tile 1 goes first; each cobbled tile lets it reach the next.</text>
  <text class="t bd" x="436" y="436">&#8226; cobble_work = 3 builder-seconds at BUILD_SPEED; up to 4</text>
  <text class="t bd" x="436" y="456">  builders per tile, and several tiles at once.</text>
  <text class="t bd" x="436" y="480">&#8226; <tspan class="no">?</tspan> An island with no walkable neighbour waits, still marked,</text>
  <text class="t bd" x="436" y="500">  until the tiles around it are cobbled.</text>

  <!-- ===== C: tile jobs ===== -->
  <text class="t h2" x="40" y="572">C &#183; Tile jobs on the builders' job board</text>

  <rect class="stat" x="40" y="590" width="960" height="60" rx="8"/>
  <text class="t lb" x="56" y="616">Priority:</text>
  <text class="m bd" x="140" y="616">BUILD  &gt;  REPAIR  &gt;  FILL  &gt;  COBBLE  &gt;  CHOP</text>
  <text class="t sm mu" x="56" y="638">FILL and COBBLE are tile jobs; BUILD, REPAIR and CHOP target buildings (trees are buildings).</text>

  <rect class="box" x="40" y="670" width="470" height="120" rx="8"/>
  <text class="t lb" x="56" y="694">Ids mean different things</text>
  <text class="t sm" x="56" y="716">Building jobs list building ids; tile jobs list grid tile indices</text>
  <text class="t sm" x="56" y="734">(y * width + x). UnitStore.job remembers which kind a builder's</text>
  <text class="t sm" x="56" y="752">target is, so a building being removed never cancels a tile job</text>
  <text class="t sm" x="56" y="770">that happens to have the same number.</text>

  <rect class="good" x="530" y="670" width="470" height="120" rx="8"/>
  <text class="t lb" x="546" y="694">The grid does the rest</text>
  <text class="t sm" x="546" y="716">set_ground_runtime changes one tile and redraws it. WorldGrid</text>
  <text class="t sm" x="546" y="734">announces it (tiles_changed), so pathing updates that tile only.</text>
  <text class="t sm" x="546" y="752">Cobble allows houses and depots (allowed_grounds bit 9), so a</text>
  <text class="t sm" x="546" y="770">miner house can stand next to a gold mine.</text>

  <rect class="stop" x="40" y="810" width="960" height="70" rx="8"/>
  <text class="t lb no" x="56" y="834">Saved</text>
  <text class="t bd" x="56" y="856">Cobble is ground, already saved per tile. Marks and cobble progress are saved by cell; the fill progress as a number;</text>
  <text class="t bd" x="56" y="874">the bucket itself is in the run's unlocks. Ground.COBBLE was appended, never inserted (D8).</text>
</svg>
