<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1040" height="760" fill="#fdfcfa"/>
  <text class="t h1" x="40" y="46">Progression: XP, level-ups, augments</text>
  <text class="t sm mu" x="40" y="70">Stage 7. See ARCHITECTURE.md, "Progression" and "Stats and modifiers".</text>

  <text class="t h2" x="40" y="112">A &#183; Where XP comes from (only once the base stands)</text>
  <rect class="box" x="40" y="128" width="220" height="92" rx="8"/>
  <text class="t lb" x="56" y="152">kills</text>
  <text class="t sm mu" x="56" y="172">EnemyData.xp x hp / base hp;</text>
  <text class="t sm mu" x="56" y="190">only the base's kills count,</text>
  <text class="t sm mu" x="56" y="208">not the dawn sweep</text>
  <rect class="box" x="280" y="128" width="220" height="92" rx="8"/>
  <text class="t lb" x="296" y="152">exploration</text>
  <text class="t sm mu" x="296" y="172">1 per 25 tiles revealed;</text>
  <text class="t sm mu" x="296" y="190">5 per point of interest opened</text>
  <rect class="box" x="520" y="128" width="220" height="92" rx="8"/>
  <text class="t lb" x="536" y="152">survival</text>
  <text class="t sm mu" x="536" y="172">1 every 10 s of game time;</text>
  <text class="t sm mu" x="536" y="190">3 x the night number at dawn</text>
  <rect class="stat" x="780" y="128" width="220" height="92" rx="8"/>
  <text class="t lb" x="796" y="152">levels</text>
  <text class="t sm mu" x="796" y="172">15 XP for level 2, then x1.3</text>
  <text class="t sm mu" x="796" y="190">each; every level = one pick</text>
  <text class="t sm mu" x="796" y="208">pending (several can queue)</text>
  <path class="ar" d="M740,174 L776,174"/>

  <text class="t h2" x="40" y="268">B &#183; One pick (the clock is paused: reason "level_up")</text>
  <rect class="dec" x="40" y="284" width="300" height="190" rx="8"/>
  <text class="t lb" x="56" y="308">who may be offered</text>
  <text class="t sm mu" x="56" y="330">not at max stacks (commons 5, rares 1)</text>
  <text class="t sm mu" x="56" y="350">requires_tags owned, stacks counting:</text>
  <text class="t sm mu" x="56" y="370">Wildfire needs 2 fire, Volatile World</text>
  <text class="t sm mu" x="56" y="390">2 explosive, Shatter 1 frost,</text>
  <text class="t sm mu" x="56" y="410">Chain Reaction 1 explosive</text>
  <rect class="step" x="370" y="284" width="300" height="190" rx="8"/>
  <text class="t lb" x="386" y="308">weight</text>
  <text class="t sm mu" x="386" y="330">common 10, rare 3</text>
  <text class="t sm mu" x="386" y="350">x (1 + 0.5 per owned stack that</text>
  <text class="t sm mu" x="386" y="370">shares a tag), at most x3</text>
  <text class="t sm mu" x="386" y="398">three different cards, drawn by</text>
  <text class="t sm mu" x="386" y="418">weight without replacement</text>
  <rect class="good" x="700" y="284" width="300" height="190" rx="8"/>
  <text class="t lb" x="716" y="308">the player</text>
  <text class="t sm mu" x="716" y="330">picks one: stacks +1</text>
  <text class="t sm mu" x="716" y="350">rerolls: three new cards,</text>
  <text class="t sm mu" x="716" y="370">once per level-up</text>
  <text class="t sm mu" x="716" y="390">skips: 15 + 5 x level gold</text>
  <text class="t sm mu" x="716" y="418">next queued pick, or the clock</text>
  <text class="t sm mu" x="716" y="438">runs again</text>
  <path class="ar" d="M340,379 L366,379"/>
  <path class="ar" d="M670,379 L696,379"/>

  <text class="t h2" x="40" y="522">C &#183; What a taken augment changes</text>
  <rect class="stat" x="40" y="538" width="460" height="180" rx="8"/>
  <text class="t lb" x="56" y="562">commons: modifiers (source "aug:&lt;id&gt;")</text>
  <text class="t sm mu" x="56" y="584">scaled by stacks like shop upgrade levels, onto blocks</text>
  <text class="t sm mu" x="56" y="604">by tag: weapon types, arrow_tower, worker kinds, houses,</text>
  <text class="t sm mu" x="56" y="624">the shop's prices, the base's zap, and building health</text>
  <text class="t sm mu" x="56" y="644">(BuildingStats: MAX_HEALTH per building type, health</text>
  <text class="t sm mu" x="56" y="664">keeps its share). Rebuilt from stacks when a run loads.</text>
  <rect class="stop" x="530" y="538" width="470" height="180" rx="8"/>
  <text class="t lb" x="546" y="562">rares: a rule flag, pushed into its system</text>
  <text class="t sm mu" x="546" y="584">careful_aim &#8594; WeaponSystem.spare_workers</text>
  <text class="t sm mu" x="546" y="604">chain_reaction &#8594; WeaponSystem.gen_bonus = 1</text>
  <text class="t sm mu" x="546" y="624">shatter &#8594; WeaponSystem.slowed_damage = 1.3</text>
  <text class="t sm mu" x="546" y="644">volatile_world &#8594; every type gets explode_enemies</text>
  <text class="t sm mu" x="546" y="664">scavengers &#8594; EnemySystem.drop_multiplier = 2</text>
  <text class="t sm mu" x="546" y="684">wildfire &#8594; EnemySystem.spread_burn</text>
  <text class="t sm mu" x="546" y="704">second_wind &#8594; main heals the base 25% at dawn</text>
</svg>
