<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1016" width="1040" height="1016" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <radialGradient id="clear" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#9dbb78"/>
      <stop offset="1" stop-color="#9dbb78" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .lt { fill:#e9e6df; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .dash { stroke:#e9e6df; stroke-width:1.2; stroke-dasharray:4 4; fill:none; }
    </style>
  </defs>
  <rect width="1040" height="1016" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Exploration: fog, the explorer, points of interest</text>
  <text class="t sm mu" x="40" y="70">Stage 3b. See ARCHITECTURE.md, "Exploration: fog, the explorer, points of interest".</text>

  <!-- ===== A: the start ===== -->
  <text class="t h2" x="40" y="112">A &#183; A new map</text>
  <rect x="40" y="126" width="420" height="300" rx="6" fill="#16161c"/>
  <circle cx="250" cy="276" r="104" fill="url(#clear)"/>
  <circle cx="250" cy="276" r="52" fill="none" stroke="#fdfcfa" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="241" y="267" width="18" height="18" rx="2" fill="#f0d27a" stroke="#6b5a1f"/>
  <!-- ice + diamond mine -->
  <ellipse cx="316" cy="224" rx="22" ry="16" fill="#bfe3f2"/>
  <rect x="309" y="217" width="14" height="14" rx="2" fill="#7ec3ea" stroke="#2f6c8c"/>
  <!-- trees -->
  <circle cx="200" cy="232" r="6" fill="#3f6b2f"/><circle cx="178" cy="300" r="6" fill="#3f6b2f"/>
  <circle cx="226" cy="340" r="6" fill="#3f6b2f"/><circle cx="300" cy="320" r="6" fill="#3f6b2f"/>
  <circle cx="276" cy="200" r="6" fill="#3f6b2f"/><circle cx="160" cy="258" r="6" fill="#3f6b2f"/>
  <!-- POI ring -->
  <circle cx="250" cy="276" r="120" class="dash"/>
  <rect x="96" y="156" width="12" height="12" fill="#6e6a60"/><rect x="398" y="352" width="12" height="12" fill="#6e6a60"/>
  <rect x="380" y="150" width="12" height="12" fill="#6e6a60"/><rect x="78" y="376" width="12" height="12" fill="#6e6a60"/>
  <text class="t sm lt" x="52" y="414">grey: points of interest, hidden, &#8805; 16 tiles out (dashed)</text>

  <rect class="box" x="480" y="126" width="520" height="300" rx="8"/>
  <text class="t lb" x="496" y="150">What the generator guarantees</text>
  <text class="t bd" x="496" y="176">&#8226; Revealed: a disc of <tspan class="m sm">start_reveal_radius</tspan> 10 around the centre.</text>
  <text class="t bd" x="496" y="198">&#8226; Plain grass within <tspan class="m sm">start_open_radius</tspan> 5 (dashed): room</text>
  <text class="t bd" x="496" y="216">  for the base (yellow). Environments are kept out.</text>
  <text class="t bd" x="496" y="238">&#8226; An ice patch with a <tspan class="no">diamond mine</tspan>, placed first, just</text>
  <text class="t bd" x="496" y="256">  inside the disc: the one mine reachable from the start.</text>
  <text class="t bd" x="496" y="278">&#8226; At least <tspan class="m sm">start_trees</tspan> 6 trees in the disc: wood comes first.</text>
  <text class="t bd" x="496" y="300">&#8226; 7 points of interest on free grass, &#8805; 16 from the centre,</text>
  <text class="t bd" x="496" y="318">  &#8805; 8 apart, all under the fog.</text>
  <text class="t bd" x="496" y="344">&#8226; <tspan class="m sm">can_place</tspan> refuses unexplored tiles, for every building:</text>
  <text class="t bd" x="496" y="362">  the base has to go in the clearing. Tree marks, mines, lava</text>
  <text class="t bd" x="496" y="380">  marks and the bucket's water tile check the fog too.</text>
  <text class="t sm mu" x="496" y="410">The camera opens on the clearing; a loaded run opens on the base.</text>

  <!-- ===== B: exploring a tile ===== -->
  <text class="t h2" x="40" y="468">B &#183; How a tile becomes explored, and how the fog is drawn</text>

  <rect class="step" x="40" y="484" width="230" height="108" rx="8"/>
  <text class="t lb" x="56" y="508">A WALKING unit</text>
  <text class="t sm mu" x="56" y="528">crosses into a new tile</text>
  <text class="t sm mu" x="56" y="546">(<tspan class="m sm">_last</tspan> per unit id: standing</text>
  <text class="t sm mu" x="56" y="564">still costs one compare)</text>
  <text class="t sm" x="56" y="584">worker 2 &#183; explorer 6</text>

  <rect class="step" x="40" y="604" width="230" height="64" rx="8"/>
  <text class="t lb" x="56" y="628">A finished building</text>
  <text class="t sm mu" x="56" y="648"><tspan class="m sm">reveal_radius</tspan>: watchtower 12</text>

  <rect class="stat" x="310" y="530" width="230" height="96" rx="8"/>
  <text class="t lb" x="326" y="554">WorldGrid.reveal_circle</text>
  <text class="t sm mu" x="326" y="574">a disc; returns the tiles that</text>
  <text class="t sm mu" x="326" y="592">were new. <tspan class="m sm">explored</tspan> = 0 / 255,</text>
  <text class="t sm mu" x="326" y="610">saved deflated (~80 B / 10k tiles)</text>

  <rect class="good" x="580" y="484" width="200" height="72" rx="8"/>
  <text class="t lb" x="596" y="508">FogRenderer</text>
  <text class="t sm mu" x="596" y="528">L8 image straight from the</text>
  <text class="t sm mu" x="596" y="546">array; once a frame, if dirty</text>

  <rect class="good" x="580" y="600" width="200" height="72" rx="8"/>
  <text class="t lb" x="596" y="624">PointsOfInterest</text>
  <text class="t sm mu" x="596" y="644">a hidden one's tile explored</text>
  <text class="t sm mu" x="596" y="662">&#8594; <tspan class="m sm">spotted</tspan></text>

  <path class="ar" d="M270,538 L308,562"/>
  <path class="ar" d="M270,636 L308,600"/>
  <path class="ar" d="M540,562 L578,528"/>
  <path class="ar" d="M540,596 L578,628"/>

  <!-- fog edge sketch -->
  <rect class="box" x="810" y="484" width="190" height="188" rx="8"/>
  <text class="t lb" x="826" y="508">The edge</text>
  <rect x="826" y="522" width="52" height="52" fill="#9dbb78"/>
  <rect x="878" y="522" width="52" height="52" fill="#9dbb78"/>
  <rect x="930" y="522" width="52" height="52" fill="#16161c"/>
  <rect x="904" y="522" width="26" height="52" fill="#16161c" opacity="0.55"/>
  <text class="t sm mu" x="826" y="594">explored &#183; explored &#183; hidden</text>
  <text class="t sm mu" x="826" y="614">linear filter + slope &#215;2:</text>
  <text class="t sm mu" x="826" y="632">opaque at the hidden tile's</text>
  <text class="t sm mu" x="826" y="650">boundary, so it never shows</text>
  <text class="t sm mu" x="826" y="666">through. z_index 2.</text>

  <!-- ===== C: the explorer ===== -->
  <text class="t h2" x="40" y="714">C &#183; What an idle explorer does (every think, and at once when something is spotted)</text>

  <rect class="dec" x="40" y="730" width="150" height="56" rx="8"/>
  <text class="t lb" x="56" y="754">Night?</text>
  <text class="t sm mu" x="56" y="772">goal is kept</text>

  <rect class="dec" x="230" y="730" width="230" height="56" rx="8"/>
  <text class="t lb" x="246" y="754">A spotted point of interest?</text>
  <text class="t sm mu" x="246" y="772">nearest, reachable, not taken</text>

  <rect class="dec" x="500" y="730" width="230" height="56" rx="8"/>
  <text class="t lb" x="516" y="754">A goal?</text>
  <text class="t sm mu" x="516" y="772"><tspan class="m sm">cells_toward</tspan>: a partial path</text>

  <rect class="stop" x="770" y="730" width="230" height="56" rx="8"/>
  <text class="t lb" x="786" y="754">Home</text>
  <text class="t sm mu" x="786" y="772">and inside</text>

  <path class="ar" d="M190,758 L228,758"/><text class="t sm mu" x="200" y="778">no</text>
  <path class="ar" d="M460,758 L498,758"/><text class="t sm mu" x="470" y="778">no</text>
  <path class="ar" d="M730,758 L768,758"/><text class="t sm mu" x="740" y="778">no</text>
  <path class="ar" d="M115,786 L115,912 L885,912 L885,788"/><text class="t sm mu" x="124" y="812">yes</text>

  <rect class="step" x="230" y="840" width="230" height="56" rx="8"/>
  <text class="t lb" x="246" y="864">TO_POI &#8594; OPENING 3 s</text>
  <text class="t sm mu" x="246" y="882">then open() and think again</text>
  <rect class="step" x="500" y="840" width="230" height="56" rx="8"/>
  <text class="t lb" x="516" y="864">TO_EXPLORE</text>
  <text class="t sm mu" x="516" y="882">at the goal, or no closer: forget it</text>
  <path class="ar" d="M345,786 L345,838"/><text class="t sm mu" x="352" y="818">yes</text>
  <path class="ar" d="M615,786 L615,838"/><text class="t sm mu" x="622" y="818">yes</text>

  <!-- ===== D: relics ===== -->
  <text class="t h2" x="40" y="944">D &#183; Relics reach the profile only when the run is saved</text>
  <rect class="stop" x="40" y="956" width="960" height="46" rx="8"/>
  <text class="t bd" x="56" y="976">open a cache &#8594; <tspan class="m sm">relics_pending</tspan> &#8594; save_run() (dawn, quit) writes the run, then banks them into <tspan class="m sm">profile["relics"]</tspan>; death banks the rest.</text>
  <text class="t sm mu" x="56" y="994">Banking at once would let a player open a cache, quit without saving, reload the dawn save and open it again.</text>
</svg>
