<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1060" width="1040" height="1060" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .row  { fill:#faf9f6; }
    </style>
  </defs>
  <rect width="1040" height="1060" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Weapons: one tick, one shot's life, the budgets</text>
  <text class="t sm mu" x="40" y="70">Stage 5. See ARCHITECTURE.md, "Weapons, shots and effects", D6 and D10, and docs/mechanics-coverage.md.</text>

  <!-- ===== A: one tick ===== -->
  <text class="t h2" x="40" y="112">A &#183; One simulation tick (after enemies and the base's zap, on the enemies' spatial hash)</text>

  <rect class="dec" x="40" y="128" width="200" height="120" rx="8"/>
  <text class="t lb" x="56" y="152">1 &#183; burn kills</text>
  <text class="t sm mu" x="56" y="172">a burn a weapon lit</text>
  <text class="t sm mu" x="56" y="190">(EnemyStore.burn_src) that</text>
  <text class="t sm mu" x="56" y="208">kills is that weapon's kill:</text>
  <text class="t sm mu" x="56" y="226">drops, on_kill. Not dawn.</text>

  <rect class="step" x="262" y="128" width="250" height="120" rx="8"/>
  <text class="t lb" x="278" y="152">2 &#183; each finished weapon</text>
  <text class="t sm mu" x="278" y="172">every 1 / FIRE_RATE s: a target</text>
  <text class="t sm mu" x="278" y="190">in RANGE by the building's mode</text>
  <text class="t sm mu" x="278" y="208">(nearest / strongest / first), led;</text>
  <text class="t sm mu" x="278" y="226">held weapons keep blades out</text>

  <rect class="stat" x="534" y="128" width="230" height="120" rx="8"/>
  <text class="t lb" x="550" y="152">3 &#183; ProjectileSystem</text>
  <text class="t sm mu" x="550" y="172">on_step &#8594; move (walls) &#8594;</text>
  <text class="t sm mu" x="550" y="190">hits: enemies, then workers</text>
  <text class="t sm mu" x="550" y="208">(friendly fire) &#8594; life &#8594; on_expire</text>
  <text class="t sm mu" x="550" y="226">(see B)</text>

  <rect class="good" x="786" y="128" width="214" height="120" rx="8"/>
  <text class="t lb" x="802" y="152">4 &#183; EffectSystem</text>
  <text class="t sm mu" x="802" y="172">queued blasts go off (at most</text>
  <text class="t sm mu" x="802" y="190">48 a tick, the rest wait);</text>
  <text class="t sm mu" x="802" y="208">burning ground pulses every</text>
  <text class="t sm mu" x="802" y="226">10 ticks: burn + worker harm.</text>

  <path class="ar" d="M240,188 L258,188"/>
  <path class="ar" d="M512,188 L530,188"/>
  <path class="ar" d="M764,188 L782,188"/>

  <!-- ===== B: a shot's life ===== -->
  <text class="t h2" x="40" y="292">B &#183; A shot's life: where each behaviour hooks in (a set per weapon TYPE, sorted by priority)</text>

  <rect class="box" x="40" y="308" width="150" height="74" rx="8"/>
  <text class="t lb" x="56" y="332">spawn</text>
  <text class="t sm mu" x="56" y="352">DAMAGE, PIERCE,</text>
  <text class="t sm mu" x="56" y="370">BOUNCE, LIFETIME</text>

  <rect class="step" x="214" y="308" width="176" height="74" rx="8"/>
  <text class="t lb" x="230" y="332">on_step (few have it)</text>
  <text class="t sm mu" x="230" y="352">homing, hook, orbit,</text>
  <text class="t sm mu" x="230" y="370">chain balls: velocity</text>

  <rect class="box" x="414" y="308" width="190" height="74" rx="8"/>
  <text class="t lb" x="430" y="332">move, &#8804; 16 px a step</text>
  <text class="t sm mu" x="430" y="352">tile ahead stops shots,</text>
  <text class="t sm mu" x="430" y="370">or the map edge?</text>

  <path class="ar" d="M190,345 L210,345"/>
  <path class="ar" d="M390,345 L410,345"/>

  <rect class="stop" x="630" y="308" width="370" height="74" rx="8"/>
  <text class="t lb" x="646" y="332">on_wall_hit(normal)</text>
  <text class="t sm mu" x="646" y="352">normal: the side crossed, both axes at a corner.</text>
  <text class="t sm mu" x="646" y="370">explode &#183; bounce: reflect &#183; hook: reel in; else it ends</text>
  <path class="ar" d="M604,345 L626,345"/>

  <path class="ar" d="M509,382 L509,410"/>
  <rect class="stat" x="40" y="414" width="600" height="134" rx="8"/>
  <text class="t lb" x="56" y="438">touches an enemy (radius + 10 px; not the last two it hit)</text>
  <text class="t sm mu" x="56" y="458">direct damage (skipped when the set explodes: the blast does it) &#8594; on_unit_hit(e, final)</text>
  <text class="t sm" x="56" y="480">slow &#183; burn &#183; knockback</text>
  <text class="t sm mu" x="226" y="480">what being hit does; a chain passes these on</text>
  <text class="t sm" x="56" y="500">chain &#183; explode &#183; split</text>
  <text class="t sm mu" x="226" y="500">every hit; split replaces the shot with its children</text>
  <text class="t sm" x="56" y="520">hook &#183; balls &#183; bounce</text>
  <text class="t sm mu" x="226" y="520">hook and chain balls grab and keep going; bounce: final hit only</text>
  <text class="t sm mu" x="56" y="540">pierce_left &gt; 0: &#8722;1 and fly on. Final and nobody kept it: the shot ends.</text>

  <rect class="dec" x="660" y="414" width="340" height="134" rx="8"/>
  <text class="t lb" x="676" y="438">touches an exposed worker</text>
  <text class="t sm mu" x="676" y="458">friendly fire (per weapon, default on):</text>
  <text class="t sm mu" x="676" y="476">full damage; costs a pierce, or the shot</text>
  <text class="t sm mu" x="676" y="494">stops there as if its life ran out</text>
  <text class="t sm mu" x="676" y="512">(a shell still explodes). Workers inside</text>
  <text class="t sm mu" x="676" y="530">buildings are never hit.</text>

  <rect class="good" x="40" y="566" width="440" height="74" rx="8"/>
  <text class="t lb" x="56" y="590">life runs out &#8594; on_expire</text>
  <text class="t sm mu" x="56" y="610">explode (a shell lands where it was aimed) &#183; burning ground</text>
  <text class="t sm mu" x="56" y="628">(1 in 4 flames) &#183; hook: let go and reel in, keep</text>

  <rect class="good" x="500" y="566" width="500" height="74" rx="8"/>
  <text class="t lb" x="516" y="590">any kill by this weapon type &#8594; on_kill(type, gen, at)</text>
  <text class="t sm mu" x="516" y="610">shot, blast or burn: all go through WeaponSystem.hit_enemy.</text>
  <text class="t sm mu" x="516" y="628">explode enemies: a blast 8 ticks later, one generation on</text>

  <!-- ===== C: the seven ===== -->
  <text class="t h2" x="40" y="684">C &#183; The seven weapons (every upgrade needs its blueprint; behaviour upgrades are rare)</text>
  <rect class="row" x="40" y="698" width="960" height="24"/>
  <text class="t lb" x="50" y="715">weapon</text>
  <text class="t lb" x="170" y="715">always</text>
  <text class="t lb" x="360" y="715">behaviour upgrade</text>
  <text class="t lb" x="560" y="715">stat upgrades</text>
  <text class="t lb" x="800" y="715">aims at</text>

  <text class="t bd" x="50" y="744">Arrow</text><text class="t sm mu" x="170" y="744">pierce 1</text><text class="t sm" x="360" y="744">split, homing</text><text class="t sm mu" x="560" y="744">+1 pierce</text><text class="t sm mu" x="800" y="744">nearest (known at start)</text>
  <text class="t bd" x="50" y="768">Cannon</text><text class="t sm mu" x="170" y="768">explode, knockback</text><text class="t sm" x="360" y="768">bounce, explode enemies</text><text class="t sm mu" x="560" y="768">+20% blast and knockback</text><text class="t sm mu" x="800" y="768">first</text>
  <text class="t bd" x="50" y="792">Frost</text><text class="t sm mu" x="170" y="792">slow</text><text class="t sm" x="360" y="792">chain (2 more)</text><text class="t sm mu" x="560" y="792">+10% slow</text><text class="t sm mu" x="800" y="792">nearest</text>
  <text class="t bd" x="50" y="816">Flame</text><text class="t sm mu" x="170" y="816">burn, burning ground</text><text class="t sm" x="360" y="816">explode enemies (cinders)</text><text class="t sm mu" x="560" y="816">+50% burn time and patch size</text><text class="t sm mu" x="800" y="816">nearest</text>
  <text class="t bd" x="50" y="840">Hook</text><text class="t sm mu" x="170" y="840">hook</text><text class="t sm mu" x="360" y="840">&#8212;</text><text class="t sm mu" x="560" y="840">+30% pull and damage; +20% range</text><text class="t sm mu" x="800" y="840">strongest</text>
  <text class="t bd" x="50" y="864">Chain cannon</text><text class="t sm mu" x="170" y="864">chain ball: catch, drag, stun</text><text class="t sm" x="360" y="864">paying-out chain</text><text class="t sm mu" x="560" y="864">+2 caught; +25% stun time</text><text class="t sm mu" x="800" y="864">first</text>
  <text class="t bd" x="50" y="888">Whirl</text><text class="t sm mu" x="170" y="888">orbit (held)</text><text class="t sm mu" x="360" y="888">&#8212;</text><text class="t sm mu" x="560" y="888">+1 blade; +20% orbit</text><text class="t sm mu" x="800" y="888">does not aim</text>

  <!-- ===== D: budgets ===== -->
  <text class="t h2" x="40" y="934">D &#183; Budgets: nothing can grow without bound</text>
  <rect class="stop" x="40" y="950" width="226" height="84" rx="8"/>
  <text class="t lb" x="56" y="974">shots: 800</text>
  <text class="t sm mu" x="56" y="994">preallocated; a spawn with</text>
  <text class="t sm mu" x="56" y="1012">the pool full is dropped</text>
  <rect class="stop" x="282" y="950" width="226" height="84" rx="8"/>
  <text class="t lb" x="298" y="974">effects: 256</text>
  <text class="t sm mu" x="298" y="994">blasts and burning ground;</text>
  <text class="t sm mu" x="298" y="1012">full: dropped</text>
  <rect class="stop" x="524" y="950" width="226" height="84" rx="8"/>
  <text class="t lb" x="540" y="974">generation: 1&#8211;2</text>
  <text class="t sm mu" x="540" y="994">split children and chained</text>
  <text class="t sm mu" x="540" y="1012">blasts stop at max_generation</text>
  <rect class="stop" x="766" y="950" width="234" height="84" rx="8"/>
  <text class="t lb" x="782" y="974">48 blasts a tick</text>
  <text class="t sm mu" x="782" y="994">a detonating crowd is spread</text>
  <text class="t sm mu" x="782" y="1012">over ticks, never one spike</text>
</svg>
