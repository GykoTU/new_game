<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" width="1040" height="860" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"    stop-color="#ffe9b8"/>
      <stop offset="0.615" stop-color="#ffe9b8"/>
      <stop offset="0.675" stop-color="#2b3350"/>
      <stop offset="0.905" stop-color="#2b3350"/>
      <stop offset="0.965" stop-color="#ffe9b8"/>
      <stop offset="1"    stop-color="#ffe9b8"/>
    </linearGradient>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .tick { stroke:#6b675f; stroke-width:1; stroke-dasharray:3 3; }
      .curve{ fill:none; stroke:#3d6fb4; stroke-width:2.2; }
    </style>
  </defs>
  <rect width="1040" height="860" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">The day, the night and the end of a run</text>
  <text class="t sm mu" x="40" y="70">Stage 3. RunDirector, counted in simulation ticks. See ARCHITECTURE.md, "Day, night and the end of a run".</text>

  <!-- ===== A: the cycle ===== -->
  <text class="t h2" x="40" y="112">A &#183; One cycle, at speed 1</text>

  <!-- 120 s day + 60 s night + a slice of the next day, 960 px for 195 s -->
  <rect x="40" y="128" width="960" height="34" rx="4" fill="url(#sky)" stroke="#ccc5b9" stroke-width="1.2"/>
  <line class="tick" x1="630" y1="122" x2="630" y2="230"/>
  <line class="tick" x1="925" y1="122" x2="925" y2="230"/>
  <text class="t lb" x="300" y="150" text-anchor="middle" style="fill:#3b3218">Day 1  &#183;  120 s</text>
  <text class="t lb" x="778" y="150" text-anchor="middle" style="fill:#e8eaf2">Night 1  &#183;  60 s</text>
  <text class="t lb" x="965" y="150" text-anchor="middle" style="fill:#3b3218">Day 2</text>

  <!-- light curve: 0 = dark at the top of the band, 1 = light -->
  <path class="curve" d="M40,178 L630,178 C645,178 655,222 660,222 L895,222 C900,222 910,178 925,178 L1000,178"/>
  <text class="t sm mu" x="44" y="196">light</text>
  <text class="t sm mu" x="668" y="240">dark (night_light 0.45, tinted blue)</text>

  <text class="t sm" x="630" y="256" text-anchor="middle">dusk</text>
  <text class="t sm mu" x="630" y="272" text-anchor="middle">6 s fade, inside the night</text>
  <text class="t sm" x="925" y="256" text-anchor="middle">dawn</text>
  <text class="t sm mu" x="925" y="272" text-anchor="middle">6 s fade, inside the night</text>

  <rect class="box" x="40" y="286" width="960" height="46" rx="6"/>
  <text class="t bd" x="56" y="306">Both twilights belong to the NIGHT, so every day is fully lit end to end &#8212; including day 1, where the player is still placing</text>
  <text class="t bd" x="56" y="324">the base &#8212; and the light is still continuous at both boundaries, because the night starts and ends at zero darkness.</text>

  <!-- ===== B: dusk and dawn ===== -->
  <text class="t h2" x="40" y="376">B &#183; What the two boundaries do</text>

  <rect class="stat" x="40" y="392" width="470" height="200" rx="8"/>
  <text class="t lb" x="56" y="416">Dusk &#8212; phase_changed(is_night = true)</text>
  <text class="t bd" x="56" y="442">&#8226; Everyone stops and heads home; half-built sites keep</text>
  <text class="t bd" x="56" y="460">  their progress.</text>
  <text class="t bd" x="56" y="482">&#8226; <tspan class="no">Builders still take REPAIR jobs</tspan> &#8212; which means</text>
  <text class="t bd" x="56" y="500">  standing outside to do them. That is the risk.</text>
  <text class="t bd" x="56" y="522">&#8226; Carriers leave drops where they lie until morning.</text>
  <text class="t bd" x="56" y="544">&#8226; The commuting first miner leaves its mine and</text>
  <text class="t bd" x="56" y="562">  <tspan class="m sm">_commuter_mine</tspan> remembers which one it was.</text>
  <text class="t sm mu" x="56" y="582">Waves will hang off this signal (Stage 4).</text>

  <rect class="good" x="530" y="392" width="470" height="200" rx="8"/>
  <text class="t lb" x="546" y="416">Dawn &#8212; day_started(day), then phase_changed</text>
  <text class="t bd" x="546" y="442">&#8226; The day number goes up first, so a listener that cares</text>
  <text class="t bd" x="546" y="460">  only about new days never tests the flag.</text>
  <text class="t bd" x="546" y="482">&#8226; <tspan class="no">Autosave.</tspan> A lost run costs at most one day, and</text>
  <text class="t bd" x="546" y="500">  nobody is mid-job at a boundary.</text>
  <text class="t bd" x="546" y="522">&#8226; A "Day N" toast.</text>
  <text class="t bd" x="546" y="544">&#8226; The commuter walks back to the same mine, unless the</text>
  <text class="t bd" x="546" y="562">  player sent it elsewhere overnight or the mine is gone.</text>
  <text class="t sm mu" x="546" y="582">Everyone else re-decides on their next think (a third of a second).</text>

  <!-- ===== C: where the light goes ===== -->
  <text class="t h2" x="40" y="636">C &#183; The tint colours the world, never the UI</text>

  <rect class="box" x="40" y="652" width="300" height="96" rx="8"/>
  <text class="t lb" x="56" y="676">Main (Node2D)</text>
  <text class="m sm" x="56" y="698">CanvasModulate "DayNightTint"</text>
  <text class="t sm mu" x="56" y="718">Level &#183; LavaMarks &#183; UnitRenderer</text>
  <text class="t sm mu" x="56" y="736">all sit on this same canvas layer</text>

  <rect class="box" x="400" y="652" width="300" height="96" rx="8"/>
  <text class="t lb" x="416" y="676">UI (CanvasLayers)</text>
  <text class="t sm mu" x="416" y="698">resource bar, day bar, item bar,</text>
  <text class="t sm mu" x="416" y="716">building bar, toast, summary</text>
  <text class="t sm" x="416" y="738">untouched: readable at midnight</text>

  <rect class="stat" x="760" y="652" width="240" height="96" rx="8"/>
  <text class="t lb" x="776" y="676">Day bar</text>
  <text class="t sm mu" x="776" y="698">day number, sun / moon, and a</text>
  <text class="t sm mu" x="776" y="716">bar that DRAINS as the phase</text>
  <text class="t sm mu" x="776" y="734">runs out. Polled once a frame.</text>


  <!-- ===== D: death ===== -->
  <text class="t h2" x="40" y="792">D &#183; The base falls</text>

  <rect class="stop" x="40" y="800" width="960" height="52" rx="8"/>
  <text class="t bd" x="56" y="822">building_removed("base") &#8594; pause "game_over" (never popped) &#8594; delete the run save &#8594; profile += runs_ended, best_day,</text>
  <text class="t bd" x="56" y="842">total_ticks &#8594; the summary over the frozen world &#8594; Return to title.  After that <tspan class="m sm">save_run()</tspan> does nothing at all.</text>
</svg>
