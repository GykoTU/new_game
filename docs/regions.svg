<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" width="1040" height="860" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1040" height="860" fill="#fdfcfa"/>
  <text class="t h1" x="40" y="46">Regions, caves and the snowstorm</text>
  <text class="t sm mu" x="40" y="70">Stage 10. See ARCHITECTURE.md, "Terrain: regions, caves and the snowstorm".</text>

  <text class="t h2" x="40" y="112">A &#183; The chain: mountains between regions, one pass each, sealed by the next region's hazard</text>
  <rect x="40" y="128" width="960" height="190" rx="8" fill="#6f665c" opacity="0.18"/>
  <circle cx="120" cy="222" r="56" fill="#dcead3" stroke="#7faa7f" stroke-width="1.6"/>
  <text class="t lb" x="120" y="218" text-anchor="middle">valley</text>
  <text class="t sm mu" x="120" y="236" text-anchor="middle">gold, iron</text>
  <circle cx="310" cy="222" r="56" fill="#f7e2d6" stroke="#e09a4e" stroke-width="1.6"/>
  <text class="t lb" x="310" y="218" text-anchor="middle">lava fields</text>
  <text class="t sm mu" x="310" y="236" text-anchor="middle">copper</text>
  <circle cx="500" cy="222" r="56" fill="#dfe8f7" stroke="#7ba4d4" stroke-width="1.6"/>
  <text class="t lb" x="500" y="218" text-anchor="middle">lakes</text>
  <text class="t sm mu" x="500" y="236" text-anchor="middle">quartz</text>
  <circle cx="690" cy="222" r="56" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1.6"/>
  <text class="t lb" x="690" y="218" text-anchor="middle">snowfield</text>
  <text class="t sm mu" x="690" y="236" text-anchor="middle">diamond</text>
  <circle cx="880" cy="222" r="56" fill="#e6dff0" stroke="#8a7aa8" stroke-width="1.6"/>
  <text class="t lb" x="880" y="218" text-anchor="middle">void</text>
  <text class="t sm mu" x="880" y="236" text-anchor="middle">finale (13)</text>
  <line x1="176" y1="222" x2="254" y2="222" stroke="#b9a58c" stroke-width="8"/>
  <rect x="205" y="214" width="16" height="16" fill="#d0542c"/>
  <line x1="366" y1="222" x2="444" y2="222" stroke="#b9a58c" stroke-width="8"/>
  <rect x="397" y="214" width="16" height="16" fill="#3d6fd6"/>
  <line x1="556" y1="222" x2="634" y2="222" stroke="#b9a58c" stroke-width="8"/>
  <line x1="746" y1="222" x2="824" y2="222" stroke="#b9a58c" stroke-width="8"/>
  <rect x="777" y="214" width="16" height="16" fill="#35224f"/>
  <text class="t sm mu" x="215" y="262" text-anchor="middle">cobble</text>
  <text class="t sm mu" x="405" y="262" text-anchor="middle">bridge</text>
  <text class="t sm mu" x="595" y="262" text-anchor="middle">open</text>
  <text class="t sm mu" x="785" y="262" text-anchor="middle">crossing</text>
  <circle cx="310" cy="144" r="15" fill="#f7e2d6" stroke="#e09a4e" stroke-dasharray="4 3"/>
  <line x1="310" y1="166" x2="310" y2="170" stroke="#b9a58c" stroke-width="6"/>
  <text class="t sm mu" x="340" y="148">side valley: a dead end with a find,</text>
  <text class="t sm mu" x="340" y="164">half of them behind the parent's hazard</text>
  <text class="t sm mu" x="56" y="300">Each tile knows its region (WorldGrid.region). A cache holds its region's tier. Layouts are drawn until no gated region leaks (8-way flood fill).</text>

  <text class="t h2" x="40" y="360">B &#183; Night: caves in the rock rims</text>
  <rect class="step" x="40" y="376" width="460" height="150" rx="8"/>
  <text class="t lb" x="56" y="400">walkers</text>
  <text class="t sm mu" x="56" y="422">come out of caves whose exit the base can be walked</text>
  <text class="t sm mu" x="56" y="442">to on the ground (cobble, bridges, crossings count;</text>
  <text class="t sm mu" x="56" y="462">walls and gates do not: enemies break them). The valley</text>
  <text class="t sm mu" x="56" y="482">always has two. Opening a pass joins that region's</text>
  <text class="t sm mu" x="56" y="502">caves to the night: expanding raises the threat.</text>
  <rect class="stop" x="540" y="376" width="460" height="150" rx="8"/>
  <text class="t lb" x="556" y="400">fliers</text>
  <text class="t sm mu" x="556" y="422">any cave within 60 tiles of the base, over the ridges</text>
  <text class="t sm mu" x="556" y="452">one cave the first nights, two from night 3, three</text>
  <text class="t sm mu" x="556" y="472">from night 6; the toast names their compass sides</text>
  <text class="t sm mu" x="556" y="502">maps without caves (old saves): the map edges</text>

  <text class="t h2" x="40" y="572">C &#183; The snowstorm: snow is covered unless something sees it now</text>
  <rect class="stat" x="40" y="588" width="460" height="230" rx="8"/>
  <text class="t lb" x="56" y="612">SnowStorm.storm, rebuilt every 6 ticks</text>
  <text class="t sm mu" x="56" y="634">start: every snow tile covered (255)</text>
  <text class="t sm mu" x="56" y="654">clear 3 tiles round each finished building near snow</text>
  <text class="t sm mu" x="56" y="674">clear 3 tiles round each worker in or near snow (4 for</text>
  <text class="t sm mu" x="56" y="694">the explorer), 14-tile cones of watchtowers</text>
  <text class="t sm mu" x="56" y="714">all sight stops at mountains (WorldGrid.sees)</text>
  <text class="t sm mu" x="56" y="746">covered: terrain, mines, caches and enemies are hidden;</text>
  <text class="t sm mu" x="56" y="766">an enemy there is not drawn and no weapon anywhere may</text>
  <text class="t sm mu" x="56" y="786">target it (EnemySystem.is_targetable). Snow slows all</text>
  <text class="t sm mu" x="56" y="806">walkers to 0.6x.</text>
  <rect class="good" x="540" y="588" width="460" height="230" rx="8"/>
  <text class="t lb" x="556" y="612">watchtower cone</text>
  <path d="M600,720 L760,650 A175,175 0 0 1 760,790 Z" fill="#f5e7b0" stroke="#c9a94c" stroke-width="1.4" opacity="0.9"/>
  <rect x="590" y="710" width="20" height="20" fill="#8a7a66"/>
  <text class="t sm mu" x="790" y="660">14 tiles long,</text>
  <text class="t sm mu" x="790" y="680">25&#176; either side</text>
  <text class="t sm mu" x="790" y="712">aimed by a click after</text>
  <text class="t sm mu" x="790" y="732">placing; click the tower</text>
  <text class="t sm mu" x="790" y="752">again to re-aim. Explores</text>
  <text class="t sm mu" x="790" y="772">what it covers; saved by</text>
  <text class="t sm mu" x="790" y="792">cell ("watchtowers").</text>
</svg>
