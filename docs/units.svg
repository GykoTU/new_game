<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1080" width="1040" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .ok { fill:#3f7a3f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .note { fill:#faf9f6; stroke:#ddd7cd; stroke-width:1.2; stroke-dasharray:4 3; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .arr  { stroke:#c26a6a; stroke-width:1.5; fill:none; marker-end:url(#a); stroke-dasharray:5 4; }
    </style>
  </defs>
  <rect width="1040" height="1080" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Workers: states, jobs and who owns what</text>
  <text class="t sm mu" x="40" y="70">UnitSystem.step(dt), once per simulation tick. See ARCHITECTURE.md, "Workers and carriers".</text>

  <!-- ===== A: states ===== -->
  <text class="t h2" x="40" y="112">A &#183; The six states every unit is in (UnitStore.State)</text>

  <rect class="stat" x="60" y="140" width="170" height="70" rx="8"/>
  <text class="t lb" x="78" y="166">IDLE</text>
  <text class="t sm mu" x="78" y="186">inside, hidden;</text>
  <text class="t sm mu" x="78" y="201">thinks every 20 ticks</text>

  <rect class="step" x="420" y="140" width="200" height="70" rx="8"/>
  <text class="t lb" x="438" y="166">WALKING</text>
  <text class="t sm mu" x="438" y="186">follows its path; its task</text>
  <text class="t sm mu" x="438" y="201">says what happens on arrival</text>

  <rect class="good" x="800" y="140" width="190" height="70" rx="8"/>
  <text class="t lb" x="818" y="166">WORKING</text>
  <text class="t sm mu" x="818" y="186">builder at a site or</text>
  <text class="t sm mu" x="818" y="201">damaged building</text>

  <rect class="note" x="420" y="280" width="200" height="70" rx="8"/>
  <text class="t lb" x="438" y="306">WAITING</text>
  <text class="t sm mu" x="438" y="326">miner beside its unfinished</text>
  <text class="t sm mu" x="438" y="341">worker house</text>

  <rect class="good" x="800" y="280" width="190" height="70" rx="8"/>
  <text class="t lb" x="818" y="306">STATIONED</text>
  <text class="t sm mu" x="818" y="326">miner inside the house:</text>
  <text class="t sm mu" x="818" y="341">hidden, safe, gathering</text>

  <rect class="step" x="60" y="280" width="200" height="70" rx="8"/>
  <text class="t lb" x="78" y="306">MINING</text>
  <text class="t sm mu" x="78" y="326">commuter outside its mine:</text>
  <text class="t sm mu" x="78" y="341">visible, exposed, free</text>
  <path class="ar" d="M420,203 L242,279"/>
  <text class="t sm" x="300" y="286">TO_MINE (no bed)</text>

  <path class="ar" d="M230,165 L418,165"/>
  <text class="t sm" x="238" y="156">job / fetch / sent: comes out</text>
  <path class="ar" d="M420,195 L232,195"/>
  <text class="t sm" x="238" y="214">home (GO_HOME, FLEE): goes in</text>
  <path class="ar" d="M620,165 L798,165"/>
  <text class="t sm" x="640" y="156">arrived at job (TO_JOB)</text>
  <path class="ar" d="M800,205 C650,250 300,250 190,212"/>
  <text class="t sm" x="66" y="240">work done &#8594; idle</text>
  <path class="ar" d="M520,210 L520,278"/>
  <text class="t sm" x="528" y="264">TO_MINE_HOUSE, not built yet</text>
  <path class="ar" d="M620,315 L798,315"/>
  <text class="t sm" x="640" y="306">construction_completed</text>
  <path class="ar" d="M615,210 L840,278"/>
  <text class="t sm" x="742" y="240">house already stands</text>
  <path class="arr" d="M895,350 C895,420 40,420 40,300 L40,215 L58,205"/>
  <text class="t sm no" x="400" y="416">home destroyed &#8594; miners flee (FLEE): to the base, the commuter to its house</text>

  <!-- ===== B: loops per kind ===== -->
  <text class="t h2" x="40" y="452">B &#183; What each kind does</text>

  <!-- miner -->
  <rect class="box" x="40" y="470" width="960" height="92" rx="8"/>
  <text class="t lb" x="58" y="494">Miner</text>
  <text class="t bd" x="58" y="516">Click the miner slot, then a mine. An idle bought miner goes first; a mine with no home gets one, paid for now (BuildingData.cost).</text>
  <text class="t bd" x="58" y="536">No bought miner idle &#8594; the commuter goes: into a free bed there for good, else it mines outside (MINING) for free.</text>
  <text class="t bd" x="58" y="556">Stationed: each whole unit of GATHER_RATE work pops a drop that bounces out of the mine. 20 drops lying around &#8594; the mine pauses.</text>

  <!-- builder -->
  <rect class="box" x="40" y="574" width="960" height="92" rx="8"/>
  <text class="t lb" x="58" y="598">Builder</text>
  <text class="t bd" x="58" y="620">Idle &#8594; asks the JobBoard. Providers list the buildings needing work right now, so the board never drifts from the world.</text>
  <text class="t bd" x="58" y="640">Priority build &gt; repair &gt; cobble (2c) &gt; chop (2b); nearest first within a priority; at most 4 builders on one job.</text>
  <text class="t bd" x="58" y="660">Adds BUILD_SPEED work per second to a site. Never carries resources. Nothing to do &#8594; goes home, inside.</text>

  <!-- carrier -->
  <rect class="box" x="40" y="678" width="960" height="92" rx="8"/>
  <text class="t lb" x="58" y="702">Carrier: the only unit that carries</text>
  <text class="t bd" x="58" y="724">Fetching drops is its only job: claims the nearest landed drop nobody is fetching, walks there (TO_PICKUP).</text>
  <text class="t bd" x="58" y="744">Takes it plus same-kind drops within 48 px, up to CARRY_CAPACITY (10), and carries them to the base (a depot in 2b).</text>
  <text class="t bd" x="58" y="764">The claim stops two carriers racing for one drop. Nothing to fetch &#8594; goes home, inside.</text>

  <!-- ===== C: ownership ===== -->
  <text class="t h2" x="40" y="812">C &#183; Who owns what</text>

  <rect class="stat" x="40" y="830" width="300" height="104" rx="8"/>
  <text class="t lb" x="58" y="854">UnitSystem (RefCounted)</text>
  <text class="m sm" x="58" y="876">store     UnitStore (SoA)</text>
  <text class="m sm" x="58" y="894">pathing   UnitPathing (A*)</text>
  <text class="m sm" x="58" y="912">board     JobBoard</text>
  <text class="m sm" x="58" y="930">drops     DropStore (SoA)</text>

  <rect class="step" x="370" y="830" width="300" height="104" rx="8"/>
  <text class="t lb" x="388" y="854">WorldGrid.tiles_changed</text>
  <text class="t sm" x="388" y="876">place / remove / set_ground announce</text>
  <text class="t sm" x="388" y="894">the changed tile indices; pathing</text>
  <text class="t sm" x="388" y="912">updates only those. Off (notify=false)</text>
  <text class="t sm" x="388" y="930">while a map is generated or loaded.</text>

  <rect class="good" x="700" y="830" width="300" height="104" rx="8"/>
  <text class="t lb" x="718" y="854">UnitRenderer (Node2D)</text>
  <text class="t sm" x="718" y="876">one MultiMesh per (kind, animation);</text>
  <text class="t sm" x="718" y="894">custom data = frame, flip. Drawn once</text>
  <text class="t sm" x="718" y="912">per frame from main._process, after</text>
  <text class="t sm" x="718" y="930">the simulation ticks. Reads the store.</text>


  <rect class="stop" x="40" y="956" width="960" height="92" rx="8"/>
  <text class="t lb no" x="58" y="980">Saved by cell, never by id</text>
  <text class="t bd" x="58" y="1002">Building and unit ids are reassigned when a run loads. Homes, drops, mine progress and the commuter are saved as cells</text>
  <text class="t bd" x="58" y="1022">and looked up again, which is why units load after the level. Construction progress is saved with each building.</text>
  <text class="t bd" x="58" y="1042">Old runs without units are refused (RUN_VERSION 2); the profile is never refused.</text>
</svg>
