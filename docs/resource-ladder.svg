<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1040" height="700" fill="#fdfcfa"/>
  <text class="t h1" x="40" y="46">The resource ladder</text>
  <text class="t sm mu" x="40" y="70">Stage 9. See ARCHITECTURE.md, "The resource ladder". Each gate is paid with the rung before it.</text>
  <text class="t h2" x="40" y="112">A &#183; Tiers, where they are, what opens them, what they pay for</text>
  <rect class="box" x="40" y="128" width="960" height="52" rx="8"/>
  <text class="t lb" x="56" y="150">Tier 1</text>
  <text class="t lb" x="130" y="150">wood, gold, iron</text>
  <text class="t sm mu" x="130" y="169">Start valley</text>
  <text class="t sm mu" x="400" y="150">gate: none: grass</text>
  <text class="t sm mu" x="400" y="169">workers (gold), pickaxe, arrow upgrades, gates (iron)</text>
  <path class="ar" d="M90,180 L90,190"/>
  <rect class="step" x="40" y="192" width="960" height="52" rx="8"/>
  <text class="t lb" x="56" y="214">Tier 2</text>
  <text class="t lb" x="130" y="214">copper</text>
  <text class="t sm mu" x="130" y="233">Lava fields, 11-26 tiles out</text>
  <text class="t sm mu" x="400" y="214">gate: bucket, then cobble</text>
  <text class="t sm mu" x="400" y="233">machines: cannon, hook, chain cannon, whirl</text>
  <path class="ar" d="M90,244 L90,254"/>
  <rect class="stat" x="40" y="256" width="960" height="52" rx="8"/>
  <text class="t lb" x="56" y="278">Tier 3</text>
  <text class="t lb" x="130" y="278">quartz</text>
  <text class="t sm mu" x="130" y="297">Lakes, 18-36 tiles out</text>
  <text class="t sm mu" x="400" y="278">gate: bridge (costs copper)</text>
  <text class="t sm mu" x="400" y="297">elements: flame, frost; the watchtower</text>
  <path class="ar" d="M90,308 L90,318"/>
  <rect class="good" x="40" y="320" width="960" height="52" rx="8"/>
  <text class="t lb" x="56" y="342">Tier 4</text>
  <text class="t lb" x="130" y="342">diamond</text>
  <text class="t sm mu" x="130" y="361">Ice, 28+ tiles out</text>
  <text class="t sm mu" x="400" y="342">gate: distance (mountains: Stage 10)</text>
  <text class="t sm mu" x="400" y="361">masterwork: city hall, top rare upgrades</text>
  <rect class="stop" x="40" y="384" width="960" height="52" rx="8"/>
  <text class="t lb" x="56" y="406">Tier -</text>
  <text class="t lb" x="130" y="406">(the finale, Stage 13)</text>
  <text class="t sm mu" x="130" y="425">Void, 22+ tiles out</text>
  <text class="t sm mu" x="400" y="406">gate: crossing (costs quartz)</text>
  <text class="t sm mu" x="400" y="425">a region cache for now</text>

  <text class="t h2" x="40" y="476">B &#183; Where a blueprint comes from</text>
  <rect class="dec" x="40" y="492" width="300" height="176" rx="8"/>
  <text class="t lb" x="56" y="516">its tier</text>
  <text class="t sm mu" x="56" y="538">the highest tier among what it</text>
  <text class="t sm mu" x="56" y="558">costs (ResourceKind.tier_of_cost);</text>
  <text class="t sm mu" x="56" y="578">bridge and crossing from BuildTools</text>
  <text class="t sm mu" x="56" y="610">cannon (copper) 2, frost (quartz) 3,</text>
  <text class="t sm mu" x="56" y="630">city hall (diamond) 4</text>
  <rect class="step" x="370" y="492" width="300" height="176" rx="8"/>
  <text class="t lb" x="386" y="516">a cache: its region's tier</text>
  <text class="t sm mu" x="386" y="538">the ground under it: grass 1, lava or</text>
  <text class="t sm mu" x="386" y="558">cobble 2, water 3, ice and void 4</text>
  <text class="t sm mu" x="386" y="578">first the next gate: lava = bridge,</text>
  <text class="t sm mu" x="386" y="598">water = crossing; then that tier,</text>
  <text class="t sm mu" x="386" y="618">then lower; relics when none is left</text>
  <text class="t sm mu" x="386" y="648">rare: 10% near, 45% 40 tiles out</text>
  <rect class="stat" x="700" y="492" width="300" height="176" rx="8"/>
  <text class="t lb" x="716" y="516">an enemy drop: up to reached</text>
  <text class="t sm mu" x="716" y="538">Unlocks.reached_tier: the highest</text>
  <text class="t sm mu" x="716" y="558">tier of any resource the run has</text>
  <text class="t sm mu" x="716" y="578">held (saved). A drop never offers</text>
  <text class="t sm mu" x="716" y="598">tech beyond it, so a find always</text>
  <text class="t sm mu" x="716" y="618">points at what is within reach.</text>
  <path class="ar" d="M340,580 L366,580"/>
</svg>
