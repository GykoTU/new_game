<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1000" width="1040" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .dec  { fill:#faf9f6; stroke:#8a8479; stroke-width:1.5; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .dash { stroke:#a34a4a; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#a); }
      .go   { stroke:#3f7f3f; stroke-width:2.2; fill:none; marker-end:url(#a); }
      .grass{ fill:#e9efe0; stroke:#fdfcfa; stroke-width:1.5; }
      .wall { fill:#9a9388; stroke:#fdfcfa; stroke-width:1.5; }
      .gate { fill:#d8a24a; stroke:#fdfcfa; stroke-width:1.5; }
      .base { fill:#6b5a1f; stroke:#fdfcfa; stroke-width:1.5; }
      .row  { fill:#faf9f6; }
    </style>
  </defs>
  <rect width="1040" height="1000" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Walls, gates, roads, bridges: what each tile means to whom</text>
  <text class="t sm mu" x="40" y="70">Stage 6. See ARCHITECTURE.md, "Walls, gates, roads and bridges", D1 and D5.</text>

  <!-- ===== A: layers ===== -->
  <text class="t h2" x="40" y="112">A &#183; One tile, three inputs, two readers</text>
  <rect class="box" x="40" y="128" width="200" height="120" rx="8"/>
  <text class="t lb" x="56" y="152">ground</text>
  <text class="t sm mu" x="56" y="172">grass, sand, ice, cobble,</text>
  <text class="t sm mu" x="56" y="190">water, lava, void</text>
  <rect class="step" x="40" y="258" width="200" height="94" rx="8"/>
  <text class="t lb" x="56" y="282">overlay (new)</text>
  <text class="t sm mu" x="56" y="302">none &#183; road &#183; bridge &#183;</text>
  <text class="t sm mu" x="56" y="320">crossing. Saved with the level.</text>
  <rect class="dec" x="40" y="362" width="200" height="94" rx="8"/>
  <text class="t lb" x="56" y="386">occupant</text>
  <text class="t sm mu" x="56" y="406">a building: wall, gate,</text>
  <text class="t sm mu" x="56" y="424">house, tower, tree...</text>
  <path class="ar" d="M240,188 L300,250"/>
  <path class="ar" d="M240,305 L300,290"/>
  <path class="ar" d="M240,409 L300,330"/>

  <rect class="good" x="304" y="170" width="330" height="236" rx="8"/>
  <text class="t lb" x="320" y="194">WORKERS (WorldGrid blocking + cost)</text>
  <text class="t sm" x="320" y="218">road</text><text class="t sm mu" x="452" y="218">cost 6, walked 1.6&#215; faster</text>
  <text class="t sm" x="320" y="240">bridge / crossing</text><text class="t sm mu" x="452" y="240">water / void walkable</text>
  <text class="t sm" x="320" y="262">wall</text><text class="t sm mu" x="452" y="262">solid (and stops shots)</text>
  <text class="t sm" x="320" y="284">gate</text><text class="t sm mu" x="452" y="284">walk through, day and night</text>
  <text class="t sm mu" x="320" y="314">UnitPathing (A*) weighs each tile by its</text>
  <text class="t sm mu" x="320" y="332">cost; UnitSystem._move checks IS_ROAD.</text>

  <rect class="stop" x="660" y="170" width="340" height="236" rx="8"/>
  <text class="t lb" x="676" y="194">ENEMIES (FlowFields cost_ground)</text>
  <text class="t sm" x="676" y="218">road</text><text class="t sm mu" x="808" y="218">ignored (ground cost)</text>
  <text class="t sm" x="676" y="240">bridge / crossing</text><text class="t sm mu" x="808" y="240">walkable, cost 10</text>
  <text class="t sm" x="676" y="262">wall</text><text class="t sm mu" x="808" y="262">break: 250</text>
  <text class="t sm" x="676" y="284">gate, by day</text><text class="t sm mu" x="808" y="284">open: walk through</text>
  <text class="t sm" x="676" y="306">gate, at night</text><text class="t sm mu" x="808" y="306">break: 200 &#8212; the weak point</text>
  <text class="t sm mu" x="676" y="336">Anything 150+ is "a building to break"</text>
  <text class="t sm mu" x="676" y="354">(BuildingData.break_cost). Dusk and dawn</text>
  <text class="t sm mu" x="676" y="372">re-announce gate tiles: fields rebuild.</text>

  <!-- ===== B: breach ===== -->
  <text class="t h2" x="40" y="504">B &#183; A sealed base: enemies break where it is cheapest (walk + break)</text>
  <g transform="translate(60,524)">
    <!-- 9x7 grid, cell 34 -->
    <g id="cells">
      <rect class="grass" x="0" y="0" width="340" height="272"/>
    </g>
    <!-- wall ring: cols 1..7, rows 1..6 in 34px cells -->
    <rect class="wall" x="34" y="34" width="238" height="34"/>
    <rect class="wall" x="34" y="204" width="238" height="34"/>
    <rect class="wall" x="34" y="68" width="34" height="136"/>
    <rect class="wall" x="238" y="68" width="34" height="68"/>
    <rect class="gate" x="238" y="136" width="34" height="34"/>
    <rect class="wall" x="238" y="170" width="34" height="34"/>
    <rect class="base" x="136" y="119" width="34" height="34"/>
    <text class="t sm" x="153" y="140" text-anchor="middle" style="fill:#fff">B</text>
    <text class="t sm" x="255" y="158" text-anchor="middle">G</text>
    <circle cx="306" cy="12" r="8" fill="#5a8a5a"/>
    <path class="dash" d="M300,20 L260,48"/>
    <path class="go" d="M310,22 L306,150 L275,153"/>
  </g>
  <rect class="dec" x="430" y="524" width="570" height="272" rx="8"/>
  <text class="t lb" x="446" y="548">Why the gate (test_6, "sealed base")</text>
  <text class="t sm mu" x="446" y="570">An enemy's field adds up, per step, the cost of each tile it enters.</text>
  <text class="t sm" x="446" y="596">through the north wall</text><text class="t sm mu" x="650" y="596">~ 2 tiles + 250 + walk inside</text>
  <text class="t sm" x="446" y="618">round to the gate</text><text class="t sm mu" x="650" y="618">~ 5 tiles + 200 + walk inside</text>
  <text class="t sm mu" x="446" y="646">So it walks up to ~5 extra tiles to use the gate. Farther than</text>
  <text class="t sm mu" x="446" y="664">that, it breaks the wall in front of it. Two gates on opposite</text>
  <text class="t sm mu" x="446" y="682">sides split an attack; walls you want to hold need a longer walk</text>
  <text class="t sm mu" x="446" y="700">to the gate than 5 tiles.</text>
  <text class="t sm mu" x="446" y="728">The gate is also a (small) target in its own right: threat 1,</text>
  <text class="t sm mu" x="446" y="746">walls 0. Gate 150 health, walls 300. Builders repair both, at</text>
  <text class="t sm mu" x="446" y="764">night too, walking out through the gate.</text>

  <!-- ===== C: painting ===== -->
  <text class="t h2" x="40" y="838">C &#183; Painting a tool (bottom-right bar)</text>
  <rect class="step" x="40" y="854" width="220" height="110" rx="8"/>
  <text class="t lb" x="56" y="878">drag</text>
  <text class="t sm mu" x="56" y="898">each tile paid at once;</text>
  <text class="t sm mu" x="56" y="916">Shift = gate (over an unbuilt</text>
  <text class="t sm mu" x="56" y="934">wall: swap, pay the difference)</text>
  <rect class="stat" x="290" y="854" width="220" height="110" rx="8"/>
  <text class="t lb" x="306" y="878">a plan</text>
  <text class="t sm mu" x="306" y="898">walls, gates: construction</text>
  <text class="t sm mu" x="306" y="916">sites (BUILD). Roads, bridges,</text>
  <text class="t sm mu" x="306" y="934">crossings: BuildTools (PAVE)</text>
  <rect class="good" x="540" y="854" width="220" height="110" rx="8"/>
  <text class="t lb" x="556" y="878">built by builders</text>
  <text class="t sm mu" x="556" y="898">bridges and crossings only</text>
  <text class="t sm mu" x="556" y="916">where they touch walkable</text>
  <text class="t sm mu" x="556" y="934">ground: out from the shore</text>
  <rect class="stop" x="790" y="854" width="210" height="110" rx="8"/>
  <text class="t lb" x="806" y="878">take it back</text>
  <text class="t sm mu" x="806" y="898">a stroke that starts on a</text>
  <text class="t sm mu" x="806" y="916">plan unpaints: full refund.</text>
  <text class="t sm mu" x="806" y="934">Built walls: the shovel (half).</text>
  <path class="ar" d="M260,909 L286,909"/>
  <path class="ar" d="M510,909 L536,909"/>
</svg>
