<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" width="1040" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .no { fill:#a34a4a; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:14px; font-weight:600; }
      .bd { font-size:13px; }
      .sm { font-size:12px; }
      .box  { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .step { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.6; }
      .stat { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.6; }
      .good { fill:#f2f8f2; stroke:#7faa7f; stroke-width:1.6; }
      .stop { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .note { fill:#faf9f6; stroke:#ddd7cd; stroke-width:1.2; stroke-dasharray:4 3; }
      .ar   { stroke:#6b675f; stroke-width:1.7; fill:none; marker-end:url(#a); }
      .arr  { stroke:#c26a6a; stroke-width:1.5; fill:none; marker-end:url(#a); stroke-dasharray:5 4; }
    </style>
  </defs>
  <rect width="1040" height="900" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">Wood, crafting and the building bar</text>
  <text class="t sm mu" x="40" y="70">Stage 2b. See ARCHITECTURE.md, "Wood, crafting and the building bar".</text>

  <!-- ===== A: wood ===== -->
  <text class="t h2" x="40" y="112">A &#183; From a tree to wood in the bank</text>

  <rect class="step" x="40" y="130" width="170" height="86" rx="8"/>
  <text class="t lb" x="56" y="154">Click a tree</text>
  <text class="t sm mu" x="56" y="174">main._tree_click</text>
  <text class="t sm mu" x="56" y="192">Forest.toggle_mark &#8594;</text>
  <text class="t sm mu" x="56" y="208">red tint; fruit trees: no</text>

  <rect class="stat" x="240" y="130" width="170" height="86" rx="8"/>
  <text class="t lb" x="256" y="154">JobBoard CHOP</text>
  <text class="t sm mu" x="256" y="174">lists marked trees;</text>
  <text class="t sm mu" x="256" y="192">below build and repair</text>
  <text class="t sm mu" x="256" y="208">(city hall: later)</text>

  <rect class="good" x="440" y="130" width="170" height="86" rx="8"/>
  <text class="t lb" x="456" y="154">Builder chops</text>
  <text class="t sm mu" x="456" y="174">BUILD_SPEED per sec</text>
  <text class="t sm mu" x="456" y="192">into Forest.chop();</text>
  <text class="t sm mu" x="456" y="208">felled at chop_work = 4</text>

  <rect class="step" x="640" y="130" width="170" height="86" rx="8"/>
  <text class="t lb" x="656" y="154">Tree &#8594; stump</text>
  <text class="t sm mu" x="656" y="174">3 wood drops pop out</text>
  <text class="t sm mu" x="656" y="192">(no mine cap)</text>
  <text class="t sm mu" x="656" y="208">stump timer scheduled</text>

  <rect class="good" x="840" y="130" width="160" height="86" rx="8"/>
  <text class="t lb" x="856" y="154">Carrier fetches</text>
  <text class="t sm mu" x="856" y="174">to the nearer of base</text>
  <text class="t sm mu" x="856" y="192">and finished depots;</text>
  <text class="t sm mu" x="856" y="208">counts on arrival</text>

  <path class="ar" d="M210,173 L238,173"/>
  <path class="ar" d="M410,173 L438,173"/>
  <path class="ar" d="M610,173 L638,173"/>
  <path class="ar" d="M810,173 L838,173"/>
  <path class="arr" d="M525,216 C525,250 330,250 325,218"/>
  <text class="t sm no" x="345" y="262">unmarked mid-chop: the builder stops; progress is kept</text>

  <!-- ===== B: crafting ===== -->
  <text class="t h2" x="40" y="322">B &#183; From the Craft tab to a standing building</text>

  <rect class="stat" x="40" y="340" width="170" height="104" rx="8"/>
  <text class="t lb" x="56" y="364">Shop, Craft tab</text>
  <text class="t sm mu" x="56" y="384">shows only blueprints</text>
  <text class="t sm mu" x="56" y="400">the run knows (Unlocks);</text>
  <text class="t sm mu" x="56" y="416">paid in resources</text>
  <text class="t sm mu" x="56" y="432">(Buy tab: gold only)</text>

  <rect class="box" x="240" y="340" width="170" height="104" rx="8"/>
  <text class="t lb" x="256" y="364">BuildingInventory</text>
  <text class="t sm mu" x="256" y="384">type &#8594; count, in the</text>
  <text class="t sm mu" x="256" y="400">order first crafted</text>
  <text class="m sm" x="256" y="424">depot x2</text>
  <text class="m sm" x="256" y="440">builder_house x1</text>

  <rect class="step" x="440" y="340" width="170" height="104" rx="8"/>
  <text class="t lb" x="456" y="364">Building bar</text>
  <text class="t sm mu" x="456" y="384">one slot per type;</text>
  <text class="t sm mu" x="456" y="400">always 5 slots; hover</text>
  <text class="t sm mu" x="456" y="416">+ Shift: more to the right;</text>
  <text class="t sm mu" x="456" y="432">click &#8594; place</text>

  <rect class="step" x="640" y="340" width="170" height="104" rx="8"/>
  <text class="t lb" x="656" y="364">BuildPlacer</text>
  <text class="t sm mu" x="656" y="384">construction mode:</text>
  <text class="t sm mu" x="656" y="400">placed: a site, and one</text>
  <text class="t sm mu" x="656" y="416">leaves the inventory;</text>
  <text class="t sm mu" x="656" y="432">cancel = nothing taken</text>

  <rect class="good" x="840" y="340" width="160" height="104" rx="8"/>
  <text class="t lb" x="856" y="364">Builders build it</text>
  <text class="t sm mu" x="856" y="384">JobBoard BUILD (top</text>
  <text class="t sm mu" x="856" y="400">priority). Complete:</text>
  <text class="t sm mu" x="856" y="416">houses add beds,</text>
  <text class="t sm mu" x="856" y="432">depots take deliveries</text>

  <path class="ar" d="M210,392 L238,392"/>
  <path class="ar" d="M410,392 L438,392"/>
  <path class="ar" d="M610,392 L638,392"/>
  <path class="ar" d="M810,392 L838,392"/>

  <rect class="note" x="40" y="466" width="960" height="46" rx="8"/>
  <text class="t sm" x="56" y="486">Miner houses (5 wood) must be placed touching a mine that has none (BuildingData.must_touch_prefix + one_per_touched);</text>
  <text class="t sm" x="56" y="503">placing links the house to that mine. Starting blueprints: builder, carrier and miner house, depot, bucket; POIs and enemies add more.</text>

  <!-- ===== C: timers ===== -->
  <text class="t h2" x="40" y="562">C &#183; The world's timers (TimedEvents, in ticks, saved)</text>

  <rect class="box" x="40" y="580" width="300" height="120" rx="8"/>
  <text class="t lb" x="56" y="604">Pending events</text>
  <text class="m sm" x="56" y="628">due 7320  stump_gone  (10, 4)</text>
  <text class="m sm" x="56" y="646">due 7700  regrow</text>
  <text class="m sm" x="56" y="664">due 9110  stump_gone  (14,15)</text>
  <text class="t sm mu" x="56" y="688">Forest.step(tick) pops what is due</text>

  <rect class="step" x="380" y="580" width="290" height="120" rx="8"/>
  <text class="t lb" x="396" y="604">stump_gone</text>
  <text class="t sm mu" x="396" y="626">scheduled when a tree falls,</text>
  <text class="t sm mu" x="396" y="644">stump_seconds (60) later.</text>
  <text class="t sm mu" x="396" y="662">Removes the stump if it is</text>
  <text class="t sm mu" x="396" y="680">still there.</text>

  <rect class="good" x="710" y="580" width="290" height="120" rx="8"/>
  <text class="t lb" x="726" y="604">regrow (repeats every 45 s)</text>
  <text class="t sm mu" x="726" y="626">if trees &lt; the map's start count:</text>
  <text class="t sm mu" x="726" y="644">one tree on a random free grass</text>
  <text class="t sm mu" x="726" y="662">tile with nothing around it, from</text>
  <text class="t sm mu" x="726" y="680">the Forest's saved RNG</text>

  <path class="ar" d="M340,640 L378,640"/>
  <path class="ar" d="M670,640 L708,640"/>

  <rect class="stop" x="40" y="730" width="960" height="130" rx="8"/>
  <text class="t lb no" x="56" y="754">Saved by cell, and in ticks</text>
  <text class="t bd" x="56" y="778">Marks, chop progress and event cells are saved as cells; building ids change when a run loads.</text>
  <text class="t bd" x="56" y="798">Event times are simulation ticks, so they pause with the game and run faster at 2x / 4x.</text>
  <text class="t bd" x="56" y="818">The RNG's seed and state are saved, so a loaded run regrows exactly the trees it would have.</text>
  <text class="t bd" x="56" y="838">Unlocks and the inventory are saved as plain ids; an older save gets the starting blueprints.</text>
</svg>
