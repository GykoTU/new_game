<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1180" width="1040" height="1180">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b675f"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#2b2a27; }
      .m  { font-family: ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; fill:#2b2a27; }
      .mu { fill:#6b675f; }
      .h1 { font-size:26px; font-weight:700; }
      .h2 { font-size:17px; font-weight:700; }
      .lb { font-size:15px; font-weight:600; }
      .bd { font-size:13.5px; }
      .sm { font-size:12.5px; }
      .box   { fill:#ffffff; stroke:#ccc5b9; stroke-width:1.5; }
      .clock { fill:#fff8ef; stroke:#e09a4e; stroke-width:1.8; }
      .sim   { fill:#f1f6fd; stroke:#7ba4d4; stroke-width:1.8; }
      .stop  { fill:#fdf2f2; stroke:#d99a9a; stroke-width:1.5; }
      .note  { fill:#faf9f6; stroke:#ddd7cd; stroke-width:1.2; stroke-dasharray:4 3; }
      .ar    { stroke:#6b675f; stroke-width:1.8; fill:none; marker-end:url(#a); }
    </style>
  </defs>

  <rect width="1040" height="1180" fill="#fdfcfa"/>

  <text class="t h1" x="40" y="46">The invisible frame pipeline</text>
  <text class="t sm mu" x="40" y="70">How one rendered frame becomes zero or more simulation ticks. See ARCHITECTURE.md, "Time and the update loop".</text>

  <!-- ============ PANEL A ============ -->
  <text class="t h2" x="40" y="116">A &#183; One frame, start to finish</text>

  <rect class="box" x="40" y="136" width="540" height="50" rx="7"/>
  <text class="m lb" x="60" y="166">Godot calls Main._process(delta)</text>

  <path class="ar" d="M310,186 L310,214"/>

  <rect class="clock" x="40" y="216" width="540" height="196" rx="7"/>
  <text class="m lb" x="60" y="243">GameClock.advance(delta) -&gt; int</text>
  <text class="t bd" x="60" y="271">1.  Running? Every pause reason cleared AND speed &gt; 0.</text>
  <text class="t bd mu" x="82" y="292">If not: drop the accumulator, return 0. Time spent in a</text>
  <text class="t bd mu" x="82" y="311">menu is never banked and replayed on resume.</text>
  <text class="t bd" x="60" y="338">2.  accumulator += delta * speed</text>
  <text class="t bd" x="60" y="365">3.  N = floor(accumulator / TICK_DELTA), capped at 8</text>
  <text class="t bd mu" x="82" y="386">The cap stops a slow frame from asking for more work</text>
  <text class="t bd mu" x="82" y="405">next frame, which would spiral. The game slows instead.</text>

  <path class="ar" d="M310,412 L310,446"/>
  <text class="m sm mu" x="322" y="434">N ticks, 0 to 8</text>

  <rect class="sim" x="40" y="448" width="540" height="252" rx="7"/>
  <text class="m lb" x="60" y="475">for i in N:  _simulate(TICK_DELTA)</text>
  <text class="t sm mu" x="60" y="497">Fixed dt, always. Order is explicit in main.gd, never signal order.</text>
  <text class="m bd" x="60" y="527">1.  units</text><text class="t bd mu" x="215" y="527">workers and carriers move</text>
  <text class="m bd" x="60" y="550">2.  enemies</text><text class="t bd mu" x="215" y="550">flow-field steering + impulse channel</text>
  <text class="m bd" x="60" y="573">3.  weapons</text><text class="t bd mu" x="215" y="573">acquire targets, fire</text>
  <text class="m bd" x="60" y="596">4.  projectiles</text><text class="t bd mu" x="215" y="596">step, walk the grid, test hits</text>
  <text class="m bd" x="60" y="619">5.  damage</text><text class="t bd mu" x="215" y="619">resolve hits, deaths, destruction</text>
  <text class="m bd" x="60" y="642">6.  director</text><text class="t bd mu" x="215" y="642">day/night, waves, spawning</text>
  <text class="t sm" x="60" y="674">Empty today. Systems land here from Stage 1 onward (TODO.md),</text>
  <text class="t sm" x="60" y="691">and each one is added to this list, in this order, deliberately.</text>

  <path class="ar" d="M310,700 L310,728"/>

  <rect class="box" x="40" y="730" width="540" height="50" rx="7"/>
  <text class="m lb" x="60" y="760">Godot renders exactly one frame</text>

  <!-- side notes -->
  <rect class="stop" x="616" y="216" width="384" height="196" rx="7"/>
  <text class="t lb" x="636" y="243">The pause gate</text>
  <text class="t bd" x="636" y="269">Pausing is a SET of named reasons, not a flag:</text>
  <text class="m sm" x="636" y="295">clock.push_pause("options_menu")</text>
  <text class="m sm" x="636" y="315">clock.toggle_player_pause()</text>
  <text class="t bd" x="636" y="344">Whoever pushes a reason pops it. So closing a</text>
  <text class="t bd" x="636" y="363">menu can never resume a run the player paused</text>
  <text class="t bd" x="636" y="382">on purpose, and two systems pausing at once</text>
  <text class="t bd" x="636" y="401">cannot cancel each other out.</text>

  <rect class="note" x="616" y="448" width="384" height="252" rx="7"/>
  <text class="t lb" x="636" y="475">Outside simulation time</text>
  <text class="t bd" x="636" y="501">These run once per real frame and ignore game</text>
  <text class="t bd" x="636" y="520">speed entirely:</text>
  <text class="t bd mu" x="636" y="548">&#183;  input handling</text>
  <text class="t bd mu" x="636" y="571">&#183;  camera pan and zoom</text>
  <text class="t bd mu" x="636" y="594">&#183;  UI layout, tweens, animation</text>
  <text class="t bd mu" x="636" y="617">&#183;  rendering</text>
  <text class="t bd" x="636" y="649">That is why the options menu and the augment</text>
  <text class="t bd" x="636" y="668">screen stay smooth while the world is frozen,</text>
  <text class="t bd" x="636" y="687">and why get_tree().paused is not used.</text>

  <rect class="note" x="616" y="730" width="384" height="50" rx="7"/>
  <text class="t bd" x="636" y="753">tick_count is the run's true age: unaffected by</text>
  <text class="t bd" x="636" y="771">frame rate, pausing or speed. The save stores it.</text>

  <!-- ============ PANEL B ============ -->
  <line x1="40" y1="822" x2="1000" y2="822" stroke="#e2ddd4" stroke-width="1.5"/>
  <text class="t h2" x="40" y="862">B &#183; Why speed adds ticks instead of scaling delta</text>
  <text class="t sm mu" x="40" y="886">A projectile crossing a one-tile wall. Dots are collision samples; the grey block is the wall.</text>

  <!-- rejected -->
  <text class="t lb" x="40" y="932">Rejected:  dt = delta * 4</text>
  <text class="t sm mu" x="270" y="932">one sample, four times the distance</text>
  <line x1="120" y1="980" x2="960" y2="980" stroke="#ccc5b9" stroke-width="2"/>
  <rect x="520" y="950" width="45" height="60" fill="#d8d2c8" stroke="#a9a196" stroke-width="1.5"/>
  <circle cx="160" cy="980" r="7" fill="#c26a6a"/>
  <circle cx="320" cy="980" r="7" fill="#c26a6a"/>
  <circle cx="480" cy="980" r="7" fill="#c26a6a"/>
  <circle cx="640" cy="980" r="7" fill="#c26a6a"/>
  <circle cx="800" cy="980" r="7" fill="#c26a6a"/>
  <circle cx="960" cy="980" r="7" fill="#c26a6a"/>
  <path d="M480,1000 C530,1036 600,1036 640,1002" stroke="#c26a6a" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
  <text class="t sm" x="492" y="1050" fill="#a34a4a">no sample lands inside the wall &#8212; the shot tunnels straight through</text>

  <!-- chosen -->
  <text class="t lb" x="40" y="1092">Chosen:  4 ticks of TICK_DELTA</text>
  <text class="t sm mu" x="320" y="1092">four samples, each the same distance as at 1x</text>
  <line x1="120" y1="1140" x2="960" y2="1140" stroke="#ccc5b9" stroke-width="2"/>
  <rect x="520" y="1110" width="45" height="60" fill="#d8d2c8" stroke="#a9a196" stroke-width="1.5"/>
  <circle cx="160" cy="1140" r="6" fill="#6f9e6f"/><circle cx="200" cy="1140" r="6" fill="#6f9e6f"/>
  <circle cx="240" cy="1140" r="6" fill="#6f9e6f"/><circle cx="280" cy="1140" r="6" fill="#6f9e6f"/>
  <circle cx="320" cy="1140" r="6" fill="#6f9e6f"/><circle cx="360" cy="1140" r="6" fill="#6f9e6f"/>
  <circle cx="400" cy="1140" r="6" fill="#6f9e6f"/><circle cx="440" cy="1140" r="6" fill="#6f9e6f"/>
  <circle cx="480" cy="1140" r="6" fill="#6f9e6f"/>
  <circle cx="542" cy="1140" r="8.5" fill="#3f7a3f"/>
  <text class="t sm" x="596" y="1146" fill="#3f7a3f">a sample lands in the wall &#8212; the hit is detected, at every speed</text>
</svg>
